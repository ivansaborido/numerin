<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3A37B5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Numerín</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: una hoja de cuaderno de cuadrícula; cabecera con estrellas y racha, pestañas, y una sola tarjeta de trabajo centrada (máx. 860px) */
:root{
  --paper:#F4F7FB; --grid:#DFE7F1; --card:#FFFFFF; --ink:#1C2740; --muted:#56657F; --line:#D3DCE8;
  --accent:#3A37B5; --accent-soft:#E6E5FA; --on-accent:#FFFFFF;
  --star:#D99A00; --star-soft:#FFF1C7;
  --ok:#157F55; --ok-soft:#DCF3E8; --ko:#BF3838; --ko-soft:#FAE1E1;
  --u:#2B78DB; --d:#1A944A; --c:#DB740A; --um:#8649DC; --dec:#BD3D7A;
  --u-soft:#DDEBFC; --d-soft:#DAF2E3; --c-soft:#FDE9D3; --um-soft:#EDE3FB;
  --f-display:"Lexend", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"Atkinson Hyperlegible", Verdana, system-ui, sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111726; --grid:#1B2336; --card:#182033; --ink:#E7EDF7; --muted:#9AA8BF; --line:#2A3550;
    --accent:#8F8CF4; --accent-soft:#26284A; --on-accent:#101425;
    --star:#FFC838; --star-soft:#3A3113;
    --ok:#46C98F; --ok-soft:#133226; --ko:#FF7B7B; --ko-soft:#3B1B1E;
    --u:#5EA2F5; --d:#45C477; --c:#F59A3C; --um:#AE86F2; --dec:#EB6FA8;
    --u-soft:#172B45; --d-soft:#15311F; --c-soft:#3A2710; --um-soft:#2A1F42;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111726; --grid:#1B2336; --card:#182033; --ink:#E7EDF7; --muted:#9AA8BF; --line:#2A3550;
  --accent:#8F8CF4; --accent-soft:#26284A; --on-accent:#101425;
  --star:#FFC838; --star-soft:#3A3113;
  --ok:#46C98F; --ok-soft:#133226; --ko:#FF7B7B; --ko-soft:#3B1B1E;
  --u:#5EA2F5; --d:#45C477; --c:#F59A3C; --um:#AE86F2; --dec:#EB6FA8;
  --u-soft:#172B45; --d-soft:#15311F; --c-soft:#3A2710; --um-soft:#2A1F42;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.5;
  padding-inline:16px; padding-block:0 48px;
}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
h2{font-size:1.5rem;font-weight:700}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,label.btn:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* Cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:12px 8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.45rem;letter-spacing:-.01em;margin-right:auto}
.logo{display:grid;grid-template-columns:repeat(2,13px);gap:3px}
.logo i{width:13px;height:13px;border-radius:3px;display:block}
.logo i:nth-child(1){background:var(--um)} .logo i:nth-child(2){background:var(--c)} .logo i:nth-child(3){background:var(--d)} .logo i:nth-child(4){background:var(--u)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-weight:600;font-size:.95rem;background:var(--card);border:1px solid var(--line)}
.pill.star{background:var(--star-soft);border-color:transparent;color:var(--ink)}
.pill.star svg{color:var(--star)}
.pill.who{cursor:pointer}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:4px 12px;scrollbar-width:none}
.tabs button{flex:0 0 auto;border:0;background:transparent;padding:10px 16px;border-radius:12px;font-weight:600;color:var(--muted)}
.tabs button[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.tabs button:not([aria-current="page"]):hover{background:var(--accent-soft);color:var(--ink)}

/* Tarjetas y botones */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 20px;border-radius:14px;border:2px solid transparent;font-weight:600;font-size:1.02rem;text-align:center}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.big{min-height:64px;font-size:1.12rem;padding-inline:24px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.speak{border:0;background:var(--accent-soft);color:var(--accent);border-radius:999px;width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}

/* Inicio */
.hello{display:flex;flex-direction:column;gap:6px;padding-block:6px 4px}
.hello h1{font-size:clamp(1.7rem,4vw,2.3rem);font-weight:800}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.action{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:20px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:150px}
.action:hover{border-color:var(--accent)}
.action .ico{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent)}
.action.hero{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.action.hero .ico{background:rgba(255,255,255,.18);color:var(--on-accent)}
.action.hero .muted{color:var(--on-accent);opacity:.85}
.action b{font-family:var(--f-display);font-size:1.15rem}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;font-weight:600;padding:4px 10px;border-radius:999px}
.legend i{width:12px;height:12px;border-radius:3px;display:block}
.k-um{background:var(--um-soft)} .k-um i{background:var(--um)}
.k-c{background:var(--c-soft)} .k-c i{background:var(--c)}
.k-d{background:var(--d-soft)} .k-d i{background:var(--d)}
.k-u{background:var(--u-soft)} .k-u i{background:var(--u)}
.progress{height:14px;border-radius:999px;background:var(--grid);overflow:hidden}
.progress > i{display:block;height:100%;background:var(--star);border-radius:999px;transition:width .5s}

/* Visuales */
.vis{background:var(--paper);border-radius:12px;padding:14px;overflow-x:auto;border:1px dashed var(--line)}
.bloques{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end}
.bgroup{display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
.bpieces{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-end;max-width:320px}
.bgroup .lab{font-size:.9rem;font-weight:600}
.pz-um{width:54px;height:54px;border-radius:6px;background:var(--um);box-shadow:inset -8px -8px 0 rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;color:#fff;font-size:.7rem;font-weight:700}
.pz-c{width:54px;height:54px;border-radius:3px;background-color:var(--c);background-image:linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px);background-size:5.4px 5.4px}
.pz-d{width:8px;height:54px;border-radius:2px;background-color:var(--d);background-image:linear-gradient(rgba(255,255,255,.4) 1px,transparent 1px);background-size:8px 5.4px}
.pz-u{width:9px;height:9px;border-radius:2px;background:var(--u)}
.pz-zero{width:54px;height:54px;border:2px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700}
.bignum{font-family:var(--f-num);font-size:2rem;font-weight:700;letter-spacing:.04em}
.cu{color:var(--u)} .cd{color:var(--d)} .cc{color:var(--c)} .cum{color:var(--um)} .cdec{color:var(--dec)}
table.pos{border-collapse:separate;border-spacing:6px;font-family:var(--f-num)}
table.pos th{font-size:.85rem;padding:6px 10px;border-radius:8px;color:#fff}
table.pos td{font-size:1.8rem;font-weight:700;text-align:center;padding:4px 10px;border-radius:8px;background:var(--card)}
.th-u{background:var(--u)} .th-d{background:var(--d)} .th-c{background:var(--c)} .th-um{background:var(--um)}
.op{display:inline-grid;gap:2px 4px;font-family:var(--f-num);font-size:2rem;font-weight:700}
.op .cell{width:2.1rem;height:2.6rem;display:flex;align-items:center;justify-content:center;border-radius:6px}
.op .cell.col-u{background:var(--u-soft)} .op .cell.col-d{background:var(--d-soft)} .op .cell.col-c{background:var(--c-soft)} .op .cell.col-um{background:var(--um-soft)} .op .cell.col-dec{background:var(--accent-soft)}
.op .rule{border-top:3px solid var(--ink);height:0}
.op .q{color:var(--muted)}
.frac-row{display:flex;flex-direction:column;gap:14px}
.frac-item{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.fbars{display:flex;flex-direction:column;gap:6px;flex:1 1 220px;min-width:0}
.fbar{display:flex;height:44px;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.fbar i{flex:1;border-right:2px solid var(--ink);background:var(--card)}
.fbar i:last-child{border-right:0}
.fbar i.on{background:var(--c)}
.frac{display:inline-flex;flex-direction:column;align-items:center;font-family:var(--f-num);font-weight:700;line-height:1.05;vertical-align:middle}
.frac span:first-child{border-bottom:2px solid currentColor;padding:0 4px}
.frac.big{font-size:1.7rem}
.groups{display:flex;flex-wrap:wrap;gap:10px}
.grp{border:2px solid var(--d);border-radius:18px;padding:8px;display:grid;grid-template-columns:repeat(4,14px);gap:5px;background:var(--card)}
.grp i{width:14px;height:14px;border-radius:50%;background:var(--u);display:block}
svg.recta text{fill:var(--ink);font-family:var(--f-num);font-size:15px}
svg.recta .axis{stroke:var(--ink);stroke-width:2.5}
svg.recta .tick{stroke:var(--ink);stroke-width:2}
svg.recta .jump{stroke:var(--c);stroke-width:3;fill:none}
svg.recta .jumpl{fill:var(--c);font-weight:700}
svg.recta .pt{fill:var(--u)}
svg.recta .ah{fill:var(--c)}

/* Preguntas */
.qhead{display:flex;align-items:flex-start;gap:12px}
.qtext{font-size:1.3rem;font-weight:600;flex:1;min-width:0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.opt{min-height:72px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-family:var(--f-num);font-size:1.5rem;font-weight:700;padding:10px;display:flex;align-items:center;justify-content:center;text-align:center}
.opt.txt{font-family:var(--f-body);font-size:1.05rem;font-weight:600}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--ko);background:var(--ko-soft)}
.opt[disabled]{cursor:default}
.feedback{border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.feedback.ok{background:var(--ok-soft)}
.feedback.ko{background:var(--ko-soft)}
.feedback b{font-family:var(--f-display);font-size:1.15rem}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps i{width:28px;height:8px;border-radius:999px;background:var(--line);display:block}
.steps i.done{background:var(--ok)} .steps i.now{background:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:.85rem}
.chip.rep{background:var(--star-soft);color:var(--ink)}

/* Foto */
.drop{border:2px dashed var(--accent);border-radius:var(--r);padding:26px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;background:var(--accent-soft)}
.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.preview{max-height:320px;width:auto;max-width:100%;border-radius:12px;border:1px solid var(--line);align-self:center}
textarea{width:100%;min-height:90px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:12px;resize:vertical}
input[type=text],select{min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:0 14px;width:100%}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600}
.thinking{display:flex;align-items:center;gap:14px}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:4px;display:block;animation:bob 1.2s infinite ease-in-out}
.dots i:nth-child(1){background:var(--um)} .dots i:nth-child(2){background:var(--c);animation-delay:.15s} .dots i:nth-child(3){background:var(--d);animation-delay:.3s} .dots i:nth-child(4){background:var(--u);animation-delay:.45s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.notice{border-radius:12px;padding:14px;background:var(--star-soft);font-size:.95rem}
.enun{font-family:var(--f-num);font-size:1.2rem;background:var(--paper);padding:12px 14px;border-radius:12px;border-left:5px solid var(--accent)}

/* Premios */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:2px}
.tile .v{font-family:var(--f-num);font-size:1.9rem;font-weight:700}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.sticker{aspect-ratio:1;max-width:100%;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:2rem;background:var(--star-soft);border:2px solid var(--star)}
.sticker.lock{background:var(--grid);border:2px dashed var(--line);color:var(--muted);font-size:1.2rem;font-weight:700}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.badge{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.medal{width:46px;height:46px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:var(--star);color:#3a2a00}
.badge.lock .medal{background:var(--grid);color:var(--muted)}
.badge.lock{opacity:.75}

/* Progreso */
.trow{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:12px;align-items:center;padding-block:8px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.mbar{height:12px;border-radius:999px;background:var(--grid);overflow:hidden}
.mbar i{display:block;height:100%}
.hist{display:flex;flex-direction:column}
.hitem{display:flex;gap:12px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.hitem:last-child{border-bottom:0}
.hitem .t{flex:1;min-width:0}
.hitem .t p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-family:var(--f-num);font-weight:700;padding:4px 10px;border-radius:999px;font-size:.9rem}
.score.hi{background:var(--ok-soft);color:var(--ok)} .score.mid{background:var(--star-soft);color:var(--ink)} .score.lo{background:var(--ko-soft);color:var(--ko)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 4px}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);z-index:20}
.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){ .dots i,.pop{animation:none} .progress>i{transition:none} }
@media (max-width:520px){
  body{font-size:16px}
  .qtext{font-size:1.15rem}
  .trow{grid-template-columns:minmax(0,1fr) 70px auto}
  .brand{font-size:1.25rem}
}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
img{max-width:100%}
svg.reloj .cara{fill:var(--card);stroke:var(--ink);stroke-width:4}
svg.reloj .tk{stroke:var(--muted);stroke-width:1.5}
svg.reloj .tk5{stroke:var(--ink);stroke-width:3}
svg.reloj text{fill:var(--ink);font-family:var(--f-num);font-weight:700;font-size:17px}
svg.reloj .hh{stroke:var(--c);stroke-width:8;stroke-linecap:round}
svg.reloj .mm{stroke:var(--u);stroke-width:5;stroke-linecap:round}
svg.reloj .eje{fill:var(--ink)}
.reloj-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.reloj-wrap svg{width:220px;max-width:100%;height:auto;flex:0 0 auto}
.reloj-leg{display:flex;flex-direction:column;gap:6px;font-size:.95rem;min-width:0}
.reloj-leg span{display:flex;align-items:center;gap:8px}
.reloj-leg i{width:28px;height:6px;border-radius:3px;display:block}
.digital{font-family:var(--f-num);font-size:1.8rem;font-weight:700;background:var(--ink);color:var(--paper);border-radius:10px;padding:2px 14px;align-self:flex-start}
.esc{display:flex;align-items:flex-end;gap:0;overflow-x:auto;padding-bottom:4px}
.esc .st{display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 0 auto}
.esc .box{min-width:46px;padding:10px 6px;border-radius:8px;border:2px solid var(--line);background:var(--card);font-family:var(--f-num);font-weight:700;text-align:center}
.esc .box.from{border-color:var(--accent);background:var(--accent-soft)}
.esc .box.to{border-color:var(--star);background:var(--star-soft)}
.esc .arr{font-size:.75rem;color:var(--muted);padding:0 3px;align-self:center;font-family:var(--f-num)}
.esc .arr.on{color:var(--c);font-weight:700}
input[type=password]{min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:0 14px;width:100%}
a{color:var(--accent)}
.tipbox{background:var(--star-soft);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.avatar{width:30px;height:30px;border-radius:50%;overflow:hidden;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;flex:0 0 auto}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.mid{width:72px;height:72px;font-size:1.8rem;border:3px solid var(--star)}
.avatar.big{width:120px;height:120px;font-size:3rem;border:4px solid var(--star)}
.pill.who{padding-left:4px}
.hello-row{display:flex;align-items:center;gap:16px}
.hello-row .hello{flex:1;min-width:0}
.avatar-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.hidden-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">

const R = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; };
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
function fmt(n){
  if (typeof n !== 'number' || !Number.isFinite(n)) return String(n);
  let s = Math.abs(n).toFixed(3).replace(/\.?0+$/,'');
  let [i,d] = s.split('.');
  if (i.length >= 5) i = i.replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  return (n < 0 ? '−' : '') + i + (d ? ',' + d : '');
}
function horaTexto(h,m){
  h=((h-1)%12+12)%12+1; const nom=x=>x===1?'La una':`Las ${x}`, sig=h%12+1;
  if(m===0) return `${nom(h)} en punto`; if(m===15) return `${nom(h)} y cuarto`; if(m===30) return `${nom(h)} y media`;
  if(m===45) return `${nom(sig)} menos cuarto`; return m<30 ? `${nom(h)} y ${m}` : `${nom(sig)} menos ${60-m}`;
}

const canSpeak = 'speechSynthesis' in window;

function paraVoz(t){
  return String(t)
    .replace(/(\d+)\s*\/\s*(\d+)/g,(m,a,b)=>{ const n=+a, d=+b, w=DEN[d]; return `${n} ${w ? w[n===1?0:1] : (n===1?d+'avo':d+'avos')}`; })
    .replace(/\u202F/g,'').replace(/−/g,' menos ').replace(/×/g,' por ').replace(/\s:\s/g,' entre ')

}

/* ================= Dibujos ================= */
const POS = ['u','d','c','um','um','um'];
function digHTML(n){
  const s = String(Math.abs(Math.round(n)));
  return s.split('').map((ch,i)=>`<span class="c${POS[s.length-1-i]}">${ch}</span>`).join('');
}
function visBloques(n){
  n = clamp(Math.round(+n||0), 0, 9999);
  const parts = [
    ['um', Math.floor(n/1000), 'millar','millares'],
    ['c', Math.floor(n%1000/100), 'centena','centenas'],
    ['d', Math.floor(n%100/10), 'decena','decenas'],
    ['u', n%10, 'unidad','unidades']];
  let started = false, html = '';
  for (const [k,cnt,s1,sp] of parts){
    if (cnt>0) started = true;
    if (!started && k!=='u') continue;
    const pieces = cnt>0 ? Array.from({length:cnt},()=>`<span class="pz-${k}">${k==='um'?'1000':''}</span>`).join('') : `<span class="pz-zero">0</span>`;
    html += `<div class="bgroup"><div class="bpieces">${pieces}</div><span class="lab c${k}">${cnt} ${cnt===1?s1:sp}</span></div>`;
  }
  return `<div class="vis"><div class="bloques" role="img" aria-label="${n} en bloques">${html}</div><div class="bignum" style="margin-top:10px">${digHTML(n)}</div></div>`;
}
function visPosicional(n){
  n = clamp(Math.round(Math.abs(+n||0)), 0, 999999);
  const s = String(n);
  const labs = ['U','D','C','UM','DM','CM'], cls=['u','d','c','um','um','um'];
  let th='', td='';
  for (let i=s.length-1;i>=0;i--){ th += `<th class="th-${cls[i]}">${labs[i]}</th>`; td += `<td class="c${cls[i]}">${s[s.length-1-i]}</td>`; }
  return `<div class="vis"><table class="pos" aria-label="Tabla de valor posicional de ${n}"><tr>${th}</tr><tr>${td}</tr></table></div>`;
}
function numParts(x){
  const s = typeof x==='number' ? String(Math.round(Math.abs(x)*1000)/1000) : String(x).replace(',','.');
  const [i,d=''] = s.split('.'); return {i, d};
}
function visOperacion(v){
  const a=+v.a, b=+v.b; if(!Number.isFinite(a)||!Number.isFinite(b)) return '';
  const sym = {'+':'+','-':'−','x':'×','*':'×','×':'×'}[v.op] || '+';
  const hasR = v.resultado!==undefined && v.resultado!==null && Number.isFinite(+v.resultado);
  const rows = [numParts(a), numParts(b)]; if(hasR) rows.push(numParts(+v.resultado));
  const nI = Math.max(...rows.map(r=>r.i.length)), nD = Math.max(...rows.map(r=>r.d.length));
  const cols = 1 + nI + (nD? 1+nD : 0);
  const cellCls = k => 'col-'+(['u','d','c','um','um','um','um'][k]||'um');
  const line = (r, lead) => {
    let h = `<div class="cell">${lead}</div>`;
    const ip = r.i.padStart(nI,' ');
    for (let j=0;j<nI;j++){ const k=nI-1-j; const ch=ip[j]; h += `<div class="cell ${ch.trim()?cellCls(k):''}"><span class="c${['u','d','c','um','um','um','um'][k]||'um'}">${ch.trim()}</span></div>`; }
    if (nD){ h += `<div class="cell">${r.d||nD?',':''}</div>`; const dp=r.d.padEnd(nD,' '); for(let j=0;j<nD;j++) h += `<div class="cell col-dec"><span class="cdec">${dp[j].trim()}</span></div>`; }
    return h;
  };
  let h = line(rows[0],'') + line(rows[1],sym) + `<div class="rule" style="grid-column:1/-1"></div>`;
  h += hasR ? line(rows[2],'') : `<div class="cell"></div><div class="cell q" style="grid-column:2/-1;justify-content:flex-end">?</div>`;
  return `<div class="vis"><div class="op" style="grid-template-columns:repeat(${cols},auto)" role="img" aria-label="${fmt(a)} ${sym} ${fmt(b)}">${h}</div></div>`;
}
function visRecta(v){
  let a=+v.desde, b=+v.hasta; if(!Number.isFinite(a)||!Number.isFinite(b)||b<=a) return '';
  const range=b-a; const steps=[0.1,0.2,0.5,1,2,5,10,20,50,100,200,500,1000,2000,5000,10000];
  const step = steps.find(s=>range/s<=20) || 10000;
  const W=640, pad=30, y=120, X=val=>pad+(val-a)/range*(W-2*pad);
  const ticks=[]; for(let t=Math.ceil(a/step-1e-9)*step; t<=b+1e-9; t+=step) ticks.push(Math.round(t*1000)/1000);
  const every = ticks.length>12 ? 2 : 1;
  let s = `<line class="axis" x1="${pad-12}" y1="${y}" x2="${W-pad+12}" y2="${y}"/>`;
  ticks.forEach((t,i)=>{ s+=`<line class="tick" x1="${X(t)}" y1="${y-9}" x2="${X(t)}" y2="${y+9}"/>`; if(i%every===0) s+=`<text x="${X(t)}" y="${y+32}" text-anchor="middle">${fmt(t)}</text>`; });
  (Array.isArray(v.saltos)?v.saltos:[]).slice(0,6).forEach(j=>{
    const de=+j.de, aa=+j.a; if(!Number.isFinite(de)||!Number.isFinite(aa)||de===aa) return;
    const x1=X(clamp(de,a,b)), x2=X(clamp(aa,a,b)), mx=(x1+x2)/2, h=Math.min(70, 25+Math.abs(x2-x1)/4);
    s+=`<path class="jump" d="M${x1},${y-6} Q${mx},${y-6-h*1.6} ${x2},${y-6}"/>`;
    const dir = x2>x1?1:-1; s+=`<path class="ah" d="M${x2},${y-4} l${-dir*12},-10 l${dir*2},12 z"/>`;
    const d = Math.round((aa-de)*1000)/1000; s+=`<text class="jumpl" x="${mx}" y="${y-12-h*.8}" text-anchor="middle">${d>0?'+':''}${fmt(d)}</text>`;
  });
  (Array.isArray(v.puntos)?v.puntos:[]).slice(0,6).forEach(p=>{ p=+p; if(Number.isFinite(p)&&p>=a&&p<=b) s+=`<circle class="pt" cx="${X(p)}" cy="${y}" r="8"/>`; });
  return `<div class="vis"><svg class="recta" viewBox="0 0 ${W} 170" width="100%" style="min-width:420px" role="img" aria-label="Recta numérica de ${fmt(a)} a ${fmt(b)}">${s}</svg></div>`;
}
const fracHTML = (n,d,big) => `<span class="frac num ${big?'big':''}"><span>${n}</span><span>${d}</span></span>`;
function visFraccion(v){
  const fs = (Array.isArray(v.fracciones)?v.fracciones:[]).slice(0,3);
  let h='';
  for (const f of fs){
    const d=clamp(Math.round(+f.den||0),1,12), n=clamp(Math.round(+f.num||0),0,36);
    const bars = Math.max(1, Math.ceil(n/d)); let left=n, bh='';
    for (let b=0;b<bars;b++){ let cells=''; for(let i=0;i<d;i++){ cells+=`<i class="${left>0?'on':''}"></i>`; left--; } bh+=`<div class="fbar">${cells}</div>`; }
    h += `<div class="frac-item"><div class="fbars">${bh}</div>${fracHTML(n,d,true)}</div>`;
  }
  return h ? `<div class="vis"><div class="frac-row">${h}</div></div>` : '';
}
function visGrupos(v){
  const g=Math.round(+v.grupos||0), k=Math.round(+v.porGrupo||0);
  if (g<1||k<0) return '';
  if (g>12||k>12) return `<div class="vis"><p><b>${g}</b> grupos de <b>${k}</b></p></div>`;
  let h=''; for(let i=0;i<g;i++){ h+=`<div class="grp">${'<i></i>'.repeat(k)||'<span class="muted small">0</span>'}</div>`; }
  return `<div class="vis"><div class="groups" role="img" aria-label="${g} grupos de ${k}">${h}</div><p class="small muted" style="margin-top:8px">${g} ${g===1?'grupo':'grupos'} de ${k}</p></div>`;
}
function visReloj(v){
  const h = ((Math.round(+v.horas)||12)%12+12)%12, m = clamp(Math.round(+v.minutos)||0,0,59);
  const C=110, rN=84, ang=a=>(a-90)*Math.PI/180, P2=(a,r)=>[C+r*Math.cos(ang(a)), C+r*Math.sin(ang(a))];
  let s=`<circle class="cara" cx="${C}" cy="${C}" r="104"/>`;
  for(let i=0;i<60;i++){ const [x1,y1]=P2(i*6,i%5?96:90), [x2,y2]=P2(i*6,101); s+=`<line class="${i%5?'tk':'tk5'}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`; }
  for(let n=1;n<=12;n++){ const [x,y]=P2(n*30,rN-8); s+=`<text x="${x}" y="${y+6}" text-anchor="middle">${n}</text>`; }
  const [hx,hy]=P2((h+m/60)*30,50), [mx,my]=P2(m*6,80);
  s+=`<line class="hh" x1="${C}" y1="${C}" x2="${hx}" y2="${hy}"/><line class="mm" x1="${C}" y1="${C}" x2="${mx}" y2="${my}"/><circle class="eje" cx="${C}" cy="${C}" r="7"/>`;
  const dig = v.digital ? `<span class="digital">${h||12}:${String(m).padStart(2,'0')}</span>` : '';
  return `<div class="vis"><div class="reloj-wrap"><svg class="reloj" viewBox="0 0 220 220" role="img" aria-label="Reloj de agujas">${s}</svg>
    <div class="reloj-leg"><span><i style="background:var(--c)"></i>Aguja corta: la hora</span><span><i style="background:var(--u)"></i>Aguja larga: los minutos</span><span class="small muted">Cada número son 5 minutos</span>${dig}</div></div></div>`;
}
const ESCALERAS = {
  longitud:['km','hm','dam','m','dm','cm','mm'],
  peso:['kg','hg','dag','g','dg','cg','mg'],
  capacidad:['kl','hl','dal','l','dl','cl','ml']
};
function visEscalera(v){
  let us = ESCALERAS[v.magnitud];
  if (!us) us = Object.values(ESCALERAS).find(a=>a.includes(v.desde)) || ESCALERAS.longitud;
  const a=us.indexOf(v.desde), b=us.indexOf(v.hasta);
  const lo=Math.min(a,b), hi=Math.max(a,b), n=a>=0&&b>=0?Math.abs(b-a):0;
  let h='';
  us.forEach((u,i)=>{
    if(i>0) h+=`<span class="arr ${a>=0&&b>=0&&i>lo&&i<=hi?'on':''}">${a<=b?'×10':'÷10'}</span>`;
    h+=`<div class="st"><div class="box ${i===a?'from':i===b?'to':''}">${u}</div></div>`;
  });
  const fac = 10**n;
  const txt = n ? `De ${v.desde} a ${v.hasta} hay ${n} ${n===1?'escalón':'escalones'}: ${b>a?'multiplica':'divide'} por ${fmt(fac)}.` : 'Cada escalón hacia la derecha: ×10. Hacia la izquierda: ÷10.';
  return `<div class="vis"><div class="esc" role="img" aria-label="Escalera de unidades">${h}</div><p class="small" style="margin-top:8px">${txt}</p></div>`;
}
function vis(v){
  if (!v || typeof v!=='object') return '';
  try{
    switch(v.tipo){
      case 'reloj': return visReloj(v);
      case 'escalera': return visEscalera(v);
      case 'bloques': return visBloques(v.numero);
      case 'posicional': return visPosicional(v.numero);
      case 'operacion': return visOperacion(v);
      case 'recta': return visRecta(v);
      case 'fraccion': return visFraccion(v);
      case 'grupos': return visGrupos(v);
      default: return '';
    }
  }catch(e){ return ''; }
}
function optHTML(o){
  if (typeof o==='number') return fmt(o);
  const m = String(o).match(/^\s*(\d+)\s*\/\s*(\d+)\s*$/);
  if (m) return fracHTML(m[1],m[2],true);
  return esc(o);
}
const optIsText = o => typeof o!=='number' && !/^\s*\d+\s*\/\s*\d+\s*$/.test(String(o)) && String(o).length>9;

/* ================= Generador de ejercicios ================= */
const COL = ['Unidades','Decenas','Centenas','Millares','Decenas de millar','Centenas de millar'];
const NOMBRES = ['Lucía','Mateo','Sara','Hugo','Martina','Leo','Vega','Daniel','Alba','Pablo','Noa','Marco'];
const digs = n => String(n).split('').reverse().map(Number);
function sinLlevar(a,b){ const A=digs(a),B=digs(b),m=Math.max(A.length,B.length); let o=''; for(let i=0;i<m;i++) o=((A[i]||0)+(B[i]||0))%10+o; return +o; }
function restaMal(a,b){ const A=digs(a),B=digs(b); let o=''; for(let i=0;i<A.length;i++) o=Math.abs(A[i]-(B[i]||0))+o; return +o; }
const hayPrestamo = (a,b) => { const A=digs(a),B=digs(b); return A.some((x,i)=>x<(B[i]||0)); };
function explicaSuma(a,b){
  const A=digs(a),B=digs(b),m=Math.max(A.length,B.length); let c=0; const out=[];
  for(let i=0;i<m;i++){ const x=A[i]||0,y=B[i]||0,s=x+y+c; let t=`${COL[i]}: ${x} + ${y}${c?' + 1 que me llevaba':''} = ${s}`;
    if(s>=10&&i<m-1){ t+=` → escribo ${s%10} y me llevo 1.`; c=1; } else { t+=` → escribo ${s}.`; c=0; } out.push(t); }
  return out.join(' ');
}
function explicaResta(a,b){
  const A=digs(a),B=digs(b); let c=0; const out=[];
  for(let i=0;i<A.length;i++){ const x=A[i], bb=B[i]||0, y=bb+c;
    if(i>=B.length && c===0){ out.push(`${COL[i]}: bajo el ${x}.`); continue; }
    const pre = c?`${bb} + 1 que me llevaba = ${y}; `:'';
    if(x>=y){ out.push(`${COL[i]}: ${pre}de ${y} a ${x} van ${x-y}.`); c=0; }
    else { out.push(`${COL[i]}: ${pre}${x} es menor que ${y}, así que uso ${x+10}: de ${y} a ${x+10} van ${x+10-y} y me llevo 1.`); c=1; }
  }
  return out.join(' ');
}
function explicaMulti1(a,b){
  const A=digs(a); let c=0; const out=[];
  for(let i=0;i<A.length;i++){ const p=A[i]*b+c; let t=`${A[i]} × ${b}${c?` + ${c} que me llevaba`:''} = ${p}`;
    if(i<A.length-1&&p>=10){ t+=` → escribo ${p%10} y me llevo ${Math.floor(p/10)}.`; c=Math.floor(p/10); } else { t+=` → escribo ${p}.`; c=0; } out.push(t); }
  return 'Empieza por las unidades. '+out.join(' ');
}
function multiMal(a,b){ const A=digs(a); let o=''; for(const x of A) o=(x*b)%10+o; return +o; }
function randLen(len){ let s=String(R(1,9)); for(let i=1;i<len;i++) s+=R(0,9); return +s; }

function mk(tema, texto, correcta, falsas, extra={}){
  const key = v => typeof v==='number' ? String(Math.round(v*1000)/1000) : String(v).replace(/\s/g,'');
  const set=[correcta];
  for (const f of falsas){
    if (set.length>=3) break;
    if (f===undefined||f===null||(typeof f==='number'&&!Number.isFinite(f))) continue;
    if (typeof f==='number' && f<0 && !extra.neg) continue;
    if (!set.some(s=>key(s)===key(f))) set.push(f);
  }
  let t=0; while(set.length<3 && t<60 && typeof correcta==='number'){ t++; const f=correcta+pick([1,2,-1,-2,10,-10,5]); if((f>=0||extra.neg)&&!set.some(s=>key(s)===key(f))) set.push(f); }
  const opciones = shuffle(set);
  const q = {tema, texto, opciones, correcta: opciones.findIndex(o=>key(o)===key(correcta)), explicacion: extra.explicacion||''};
  if (extra.visual) q.visual = extra.visual;
  if (extra.visualExp) q.visualExp = extra.visualExp;
  return q;
}

};

/* ================= Consejos para el altavoz (sin decir la respuesta) ================= */
function numsDe(t){ return (String(t).match(/\d[\d\u202F.]*/g)||[]).map(x=>+x.replace(/[\u202F.]/g,'')); }
function consejo(q){
  const t=q.texto||'', v=q.visual||{}, ve=q.visualExp||{};
  try{
    switch(q.tema){
      case 'suma': { const A=digs(v.a),B=digs(v.b);
        return `Pon los números uno debajo del otro: unidades con unidades. Empieza por la derecha, por las unidades azules: ${A[0]} más ${B[0]}. Si te da 10 o más, escribe solo la última cifra y llévate 1 a las decenas verdes. Luego haz lo mismo con las decenas y las centenas.`; }
      case 'resta': { const A=digs(v.a),B=digs(v.b);
        return `Empieza por la derecha, por las unidades azules. Arriba hay un ${A[0]} y abajo un ${B[0]}. ` + (A[0]<B[0]
          ? `Como ${A[0]} es más pequeño que ${B[0]}, ponle un 1 delante al de arriba y piensa: de ${B[0]} a ${A[0]+10}, ¿cuántos van? No te olvides de que te llevas 1: se suma al número de abajo de la siguiente columna.`
          : `Piensa: de ${B[0]} a ${A[0]}, ¿cuántos van? Luego sigue con las decenas verdes, de la misma forma.`); }
      case 'multiplicar': { const A=digs(v.a);
        return +v.b<10 ? `Multiplica el ${v.b} por cada cifra de arriba, empezando por la derecha: primero ${A[0]} por ${v.b}. Si te sale 10 o más, escribe la última cifra y guarda las decenas para sumarlas en la siguiente columna.`
          : `Parte el ${v.b} en dos trozos: ${Math.floor(v.b/10)*10} y ${v.b%10}. Multiplica ${v.a} por cada trozo y al final suma los dos resultados.`; }
      case 'tablas': { const a=ve.grupos, b=ve.porGrupo;
        return `${a} por ${b} es lo mismo que ${a} grupos de ${b}. Cuenta de ${b} en ${b}, ${a} veces. Puedes ir levantando un dedo en cada salto.`; }
      case 'dividir': { const [D,d]=numsDe(t);
        return /sobran/.test(t) ? `Busca en la tabla del ${d} el número más grande que no se pase de ${D}. Lo que falta desde ese número hasta ${D} es lo que sobra.`
          : `Dividir es repartir en partes iguales. Piensa en la tabla del ${d}: ¿qué número multiplicado por ${d} da ${D}? Ve probando: ${d} por 2, ${d} por 3…`; }
      case 'fracciones':
        if (/pintada/.test(t)) return 'Cuenta en cuántas partes iguales está dividida la barra: ese número va abajo. Luego cuenta las partes pintadas: ese va arriba.';
        if (/mayor/.test(t)) return 'Si el número de abajo es el mismo, las partes son del mismo tamaño. Gana la fracción que tiene más partes, es decir, el número de arriba más grande.';
        return 'Primero reparte el total en tantos grupos iguales como dice el número de abajo. Después coge tantos grupos como dice el número de arriba y cuenta cuántos tienes.';
      case 'decimales':
        return /mayor/.test(t) ? 'Truco: añade ceros al final para que todos los números tengan las mismas cifras después de la coma. Así se comparan como números normales.'
          : 'Pon las comas una debajo de la otra. Suma primero las cifras de después de la coma. Si pasan de 9, te llevas 1 a las unidades. La coma del resultado va en el mismo sitio.';
      case 'porcentajes': return 'El 50 por ciento es la mitad. El 25 por ciento es la cuarta parte. El 10 por ciento es dividir entre 10. Busca cuál es el tuyo.';
      case 'enteros': return 'Imagina un termómetro. Los números bajo cero están por debajo del 0. Si la temperatura sube, avanza hacia arriba; si baja, hacia abajo. Cuenta los saltos uno a uno.';
      case 'problemas': return 'Lee el problema despacio, dos veces. Busca las palabras pista: «le regalan» o «en total» suelen ser sumar; «se bajan» o «quedan», restar; «cajas con… en cada una», multiplicar; «reparte», dividir.';
      case 'posicional':
        if (/bloques/.test(t)) return 'Cuenta los bloques de cada color por separado. Morados, millares. Naranjas, centenas. Verdes, decenas. Azules, unidades. Escribe cada número en su sitio, y si falta un color, pon un 0.';
        if (/vale/.test(t)) return 'Mira en qué lugar está la cifra, contando desde la derecha. Vale la cifra con tantos ceros como cifras tenga a su derecha.';
        return 'Cuenta desde la derecha y señala con el dedo: unidades, decenas, centenas, millares.';
      case 'reloj':
        if (/marca/.test(t)) return 'Mira primero la aguja larga, la azul: cada número vale 5 minutos, cuenta de 5 en 5 desde el 12. Luego mira la corta, la naranja: te dice la hora. Si la larga ha pasado del 6, se dice «menos» y la hora siguiente.';
        if (/termina/.test(t)) return 'Suma primero las horas y luego los minutos. Si los minutos llegan a 60 o más, son una hora más.';
        return 'Una hora son 60 minutos. Media hora son 30 minutos. Un cuarto de hora son 15 minutos.';
      case 'medida':
        if (/unidad usar/.test(t)) return 'Piensa qué mides: lo largo que es algo, en metros; lo que pesa, en kilos o gramos; o el líquido que cabe, en litros. Después piensa si es algo grande o pequeño.';
        if (/pesa más/.test(t)) return 'Para comparar, pasa todo a la misma unidad. Un kilo son 1000 gramos.';
        if (ve.tipo==='escalera') return `Usa la escalera de unidades, de ${ve.desde} a ${ve.hasta}. Cada escalón hacia abajo se multiplica por 10, y hacia arriba se divide entre 10. Cuenta los escalones.`;
        return '';
    }
  }catch(e){}
  return '';
}

/* ---- IA de Google (Gemini) ---- */
const KEY_URL = 'https://aistudio.google.com/apikey';
const MODELOS = [['gemini-3.8-flash','Gemini 3.8 Flash (gratis, recomendado)'],['gemini-3.5-flash-lite','Gemini 3.5 Flash-Lite (gratis, más rápido y con más usos al día)']];
function ia(){ return Object.assign({key:'', modelo:'gemini-3.8-flash'}, lsGet(LS_IA)||{}); }
const hayIA = () => !!ia().key;
function fotoBase64(file){
  return new Promise((ok,ko)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ const max=1600, k=Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg',.85).split(',')[1]); };
    img.onerror=()=>{ URL.revokeObjectURL(url); ko({code:'image_rejected'}); };
    img.src=url;
  });
}
function leerJSON(t){
  try{ return JSON.parse(t); }catch(e){}
  const m = t.match(/```(?:json)?\s*([\s\S]*?)```/); if(m){ try{ return JSON.parse(m[1]); }catch(e){} }
  const i=t.indexOf('{'), j=t.lastIndexOf('}'); if(i>=0&&j>i){ try{ return JSON.parse(t.slice(i,j+1)); }catch(e){} }
  throw {code:'invalid_json'};
}
const RESPALDO = 'gemini-3.5-flash-lite';
async function gemini(prompt, file, signal, cfg){
  cfg = cfg || ia();
  try{ return await geminiUna(prompt, file, signal, cfg); }
  catch(e){
    if (e && (e.code==='rate_limited'||e.code==='model') && cfg.modelo!==RESPALDO) return await geminiUna(prompt, file, signal, Object.assign({}, cfg, {modelo:RESPALDO}));
    throw e;
  }
}
async function geminiUna(prompt, file, signal, cfg){
  if (!cfg.key) throw {code:'key'};
  const parts=[{text:prompt}];
  if (file) parts.push({inline_data:{mime_type:'image/jpeg', data: await fotoBase64(file)}});
  let res;
  try{
    res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(cfg.modelo)}:generateContent`, {

function sanea(d){

    let op = (Array.isArray(p.opciones)?p.opciones:[]).slice(0,4).map(o=>String(o)).filter(Boolean);

    if (op.length<2 || !(c>=0 && c<op.length)){ op=['¡Entendido!']; c=0; }

function elegirPonderado(temas, n){
  const out=[], cuenta={};
  while(out.length<n && temas.length){
    const disp = temas.filter(t=>(cuenta[t]||0)<3); if(!disp.length) break;
    const w = disp.map(pesoTema), tot=w.reduce((a,b)=>a+b,0); let r=Math.random()*tot, k=0;
    while(r>w[k]){ r-=w[k]; k++; } const t=disp[Math.min(k,disp.length-1)];
    out.push(t); cuenta[t]=(cuenta[t]||0)+1;
  }
  return out;
}

  const r = darEstrellas(ganadas);
  EX.premiosHTML = `<p><b>+${ganadas} estrellas</b>${perfect?' (con premio por examen perfecto)':''}.</p>` + premiosHTML(r);
  addSesion({tipo:'examen', modo:EX.modo, fecha:new Date().toISOString(), tema:EX.modo==='tema'?EX.tema:'', titulo: EX.modo==='repaso'?'Repaso mezclado':EX.modo==='tema'?'Práctica: '+temaNombre(EX.tema):'Examen de '+cursoNombre(P.curso), aciertos:EX.aciertos, total:n, temas:[...new Set(EX.preguntas.map(q=>q.tema))], fallos:EX.fallos.map(q=>q.texto)});
  savePerfil(); renderHeader(); EX.estado='fin'; renderExamen();
}

/* ================= Premios ================= */
function renderPremios(){
  const nPeg=Math.min(PEGATINAS.length, Math.floor(P.estrellas/CADA));
  $('#v-premios').innerHTML = `
    <div class="tiles">
      <div class="tile"><span class="eyebrow">Estrellas</span><span class="v">${P.estrellas}</span></div>
      <div class="tile"><span class="eyebrow">Pegatinas</span><span class="v">${nPeg}<span class="muted" style="font-size:1rem"> / ${PEGATINAS.length}</span></span></div>
      <div class="tile"><span class="eyebrow">Mejor racha</span><span class="v">${P.rachaMax||0}<span class="muted" style="font-size:1rem"> días</span></span></div>
    </div>
    <div class="card"><h3>Mi colección de pegatinas</h3><p class="small muted">Una pegatina nueva cada ${CADA} estrellas.</p>
      <div class="stickers">${PEGATINAS.map((s,i)=>i<nPeg?`<div class="sticker" title="Pegatina ${i+1}">${s}</div>`:`<div class="sticker lock" aria-label="Bloqueada, ${(i+1)*CADA} estrellas">${(i+1)*CADA}</div>`).join('')}</div></div>
    <div class="card"><h3>Medallas</h3><div class="badges">${INSIGNIAS.map(b=>{const on=P.insignias.includes(b.id);return `<div class="badge ${on?'':'lock'}"><span class="medal">${ICON.medal}</span><div><b>${esc(b.n)}</b><p class="small muted">${esc(b.d)}</p></div></div>`}).join('')}</div></div>`;
}

/* ================= Progreso ================= */
function renderProgreso(){
  const temas = Object.entries(P.temas).filter(([,e])=>e.a+e.f>0).sort((x,y)=>(y[1].a+y[1].f)-(x[1].a+x[1].f));
  const tA = temas.reduce((s,[,e])=>s+e.a,0), tF = temas.reduce((s,[,e])=>s+e.f,0);
  const pct = tA+tF ? Math.round(tA/(tA+tF)*100) : 0;
  const flojos = temas.filter(([t,e])=>GEN[t] && e.a+e.f>=3 && e.a/(e.a+e.f)<.7).map(([t])=>t);
  const color = r => r>=.8?'var(--ok)':r>=.55?'var(--star)':'var(--ko)';
  const fdate = iso => { try{ return new Date(iso).toLocaleDateString('es-ES',{day:'numeric',month:'short'}); }catch(e){ return ''; } };
  $('#v-progreso').innerHTML = `
    <div class="tiles">
      <div class="tile"><span class="eyebrow">Días practicando</span><span class="v">${P.dias.length}</span></div>
      <div class="tile"><span class="eyebrow">Preguntas hechas</span><span class="v">${tA+tF}</span></div>
      <div class="tile"><span class="eyebrow">Aciertos</span><span class="v">${pct}<span class="muted" style="font-size:1rem"> %</span></span></div>
      <div class="tile"><span class="eyebrow">Para repasar</span><span class="v">${P.errores.length}</span></div>
    </div>
    <div class="card"><h3>Cómo va cada tema</h3>
      ${temas.length ? `<div>${temas.map(([t,e])=>{ const r=e.a/(e.a+e.f); return `<div class="trow"><div style="min-width:0"><b>${esc(temaNombre(t))}</b><p class="small muted num">${e.a} bien · ${e.f} mal</p></div><div class="mbar" aria-label="${Math.round(r*100)} % de aciertos"><i style="width:${Math.round(r*100)}%;background:${color(r)}"></i></div>${GEN[t]?`<button type="button" class="linkbtn" data-pt="${t}">Practicar</button>`:'<span></span>'}</div>`; }).join('')}</div>`
        : `<p class="muted">Aquí verás cada tema cuando hagas tu primer examen o expliques tu primer ejercicio.</p>`}
    </div>
    ${temas.length?`<div class="card"><h3>Resumen para mamá y papá</h3>
      <p>${esc(P.nombre)} ha practicado ${P.dias.length} ${P.dias.length===1?'día':'días'} y ha contestado ${tA+tF} preguntas, con un ${pct} % de aciertos.
      ${flojos.length?` Los temas que más le cuestan ahora son: <b>${flojos.map(t=>esc(temaNombre(t).toLowerCase())).join(', ')}</b>.`:' Ahora mismo ningún tema está por debajo del 70 %.'}
      ${P.errores.length?` Tiene ${P.errores.length} ${P.errores.length===1?'pregunta fallada guardada':'preguntas falladas guardadas'} que saldrán en el Repaso mezclado hasta que las acierte.`:''}</p></div>`:''}
    <div class="card"><h3>Historial</h3>
      ${SES.length ? `<div class="hist">${SES.slice(0,40).map((s,i)=>{ const r=s.total?s.aciertos/s.total:0; return `<div class="hitem"><span class="chip">${s.tipo==='foto'?'Foto':'Examen'}</span><div class="t"><p><b>${esc(s.titulo||'')}</b></p><p class="small muted">${fdate(s.fecha)}${s.tema?' · '+esc(temaNombre(s.tema)):''}</p></div><span class="score ${r>=.8?'hi':r>=.5?'mid':'lo'}">${s.aciertos}/${s.total}</span>${s.tipo==='foto'&&s.datos?`<button type="button" class="linkbtn" data-rev="${i}">Ver otra vez</button>`:''}</div>`; }).join('')}</div>`
        : `<p class="muted">Todavía no hay nada. Empieza con una foto o un examen.</p>`}
    </div>`;
  $('#v-progreso').querySelectorAll('[data-pt]').forEach(b=>b.onclick=()=>{ show('examen'); startExam('tema', b.dataset.pt); });
  $('#v-progreso').querySelectorAll('[data-rev]').forEach(b=>b.onclick=()=>{
    const s=SES[+b.dataset.rev]; const d=sanea(Object.assign({legible:true}, s.datos)); if(!d) return;
    PH={estado:'pasos',file:null,url:null,texto:'',data:d,paso:0,fallosPaso:0,primera:0,ctl:null,error:'',repaso:true}; show('foto');
  });
}

/* ================= Arranque ================= */
let installEvt=null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); installEvt=e; $('#installBtn').hidden=false; });
$('#installBtn').addEventListener('click', async ()=>{ if(!installEvt) return; installEvt.prompt(); try{ await installEvt.userChoice; }catch(e){} installEvt=null; $('#installBtn').hidden=true; });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
(function(){
  loadData();
  renderHeader();
  show(P && P.nombre ? 'inicio' : 'perfil');
})();
</script>
</body>
</html>
